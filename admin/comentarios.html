<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderación de Comentarios — NewsCMS</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div id="contenedor-admin" class="contenedor-admin" hidden>
        <aside id="barra-lateral" class="barra-lateral" aria-label="Módulos del panel administrativo">
            <div class="marca-admin">
                <a href="index.html" class="logo-admin">News<span>CMS</span></a>
                <span id="rol-sidebar" class="rol-usuario"></span>
            </div>

            <nav class="menu-lateral">
                <p class="grupo-menu">Módulos disponibles</p>
                <ul id="lista-modulos" class="lista-modulos"></ul>
            </nav>

            <div class="pie-sidebar">
                <a href="../index.html" class="enlace-volver">&larr; Volver al portal público</a>
            </div>
        </aside>

        <div class="area-principal">
            <header class="cabecera-admin">
                <div class="cabecera-izquierda">
                    <button
                        type="button"
                        id="boton-sidebar"
                        class="boton-sidebar"
                        aria-expanded="false"
                        aria-controls="barra-lateral"
                        aria-label="Mostrar u ocultar menú lateral"
                    >
                        &#9776;
                    </button>
                    <h1 class="titulo-modulo">Moderación de Comentarios</h1>
                </div>

                <div class="cabecera-derecha">
                    <span id="nombre-usuario" class="perfil-previa"></span>
                    <span id="rol-usuario" class="rol-usuario"></span>
                    <button type="button" id="boton-salir" class="boton-salir">Cerrar sesión</button>
                </div>
            </header>

            <main class="contenido-admin">
                <div class="barra-herramientas">
                    <a href="complementos.html" class="enlace-secundario">&larr; Volver a Complementos</a>
                    <select id="filtro-estado-comentarios" class="entrada-filtro" aria-label="Filtrar comentarios por estado">
                        <option value="">Todos</option>
                        <option value="pendiente">Pendientes</option>
                        <option value="aprobado">Aprobados</option>
                        <option value="rechazado">Rechazados</option>
                    </select>
                </div>

                <div id="mensaje-comentarios" class="alerta-admin" role="status" hidden></div>

                <section class="panel-tabla" aria-labelledby="titulo-tabla-comentarios">
                    <div class="cabecera-panel">
                        <h2 id="titulo-tabla-comentarios">Listado de Comentarios</h2>
                        <span id="total-comentarios" class="etiqueta-tabla">0 comentarios</span>
                    </div>

                    <div class="contenedor-tabla">
                        <table class="tabla-datos">
                            <thead>
                                <tr>
                                    <th>Autor</th>
                                    <th>Noticia</th>
                                    <th>Comentario</th>
                                    <th>Fecha</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpo-tabla-comentarios">
                                <tr>
                                    <td colspan="6" class="fila-vacia">Cargando comentarios...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="../js/comentarios_admin.js"></script>
</body>
</html>
