<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Noticias — NewsCMS</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div id="contenedor-admin" class="contenedor-admin" hidden>
        <aside id="barra-lateral" class="barra-lateral" aria-label="Módulos del panel administrativo">
            <div class="marca-admin">
                <a href="index.html" class="logo-admin">News<span>CMS</span></a>
                <span id="rol-sidebar" class="rol-usuario"></span>
            </div>

            <nav class="menu-lateral">
                <p class="grupo-menu">Módulos disponibles</p>
                <ul id="lista-modulos" class="lista-modulos"></ul>
            </nav>

            <div class="pie-sidebar">
                <a href="../index.html" class="enlace-volver">&larr; Volver al portal público</a>
            </div>
        </aside>

        <div class="area-principal">
            <header class="cabecera-admin cabecera-noticias-admin">
                <div class="cabecera-izquierda">
                    <button
                        type="button"
                        id="boton-sidebar"
                        class="boton-sidebar"
                        aria-expanded="false"
                        aria-controls="barra-lateral"
                        aria-label="Mostrar u ocultar menú lateral"
                    >
                        &#9776;
                    </button>
                    <h1 class="titulo-modulo">Noticias</h1>
                </div>

                <div class="cabecera-derecha cabecera-usuario-noticias">
                    <div class="ficha-usuario-cabecera">
                        <span id="nombre-usuario" class="perfil-previa"></span>
                        <span id="rol-usuario" class="rol-usuario"></span>
                    </div>
                    <button type="button" id="boton-salir" class="boton-salir">Cerrar sesión</button>
                </div>
            </header>

            <main class="contenido-admin contenido-noticias">
                <div class="modulo-noticias">
                    <div class="encabezado-modulo-noticias">
                        <div class="texto-encabezado-noticias">
                            <h2 id="titulo-lista-noticias" class="titulo-modulo-editorial">Gestión de Noticias</h2>
                            <p class="descripcion-modulo-editorial">
                                Consulta, filtra y administra el estado editorial de las noticias del portal.
                            </p>
                        </div>

                        <a href="editar_noticia.html" class="boton-primario-admin boton-nueva-noticia-lista">
                            <span aria-hidden="true">+</span> Nueva noticia
                        </a>
                    </div>

                    <div id="mensaje-noticias" class="alerta-admin" role="status" hidden></div>

                    <section class="panel-tabla panel-listado-noticias" aria-labelledby="titulo-lista-noticias">
                        <div class="barra-filtros-noticias">
                            <div class="controles-filtros-noticias">
                                <div class="campo-busqueda-noticias">
                                    <span class="icono-busqueda-noticias" aria-hidden="true">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="11" cy="11" r="7"/>
                                            <path d="m20 20-3.5-3.5"/>
                                        </svg>
                                    </span>
                                    <input
                                        type="search"
                                        id="filtro-busqueda"
                                        class="entrada-filtro entrada-busqueda-noticias"
                                        placeholder="Buscar por título..."
                                        aria-label="Buscar noticias por título"
                                    >
                                </div>

                                <select id="filtro-estado" class="entrada-filtro selector-estado-noticias" aria-label="Filtrar por estado">
                                    <option value="">Todos los estados</option>
                                    <option value="borrador">Borrador</option>
                                    <option value="pendiente_revision">Pendiente de revisión</option>
                                    <option value="cambios_solicitados">Cambios solicitados</option>
                                    <option value="publicada">Publicada</option>
                                    <option value="archivada">Archivada</option>
                                </select>
                            </div>

                            <span id="total-registros" class="etiqueta-tabla contador-noticias">0 registros</span>
                        </div>

                        <div class="contenedor-tabla">
                            <table class="tabla-datos tabla-noticias-admin">
                                <thead>
                                    <tr>
                                        <th class="col-titulo-noticias">Título</th>
                                        <th class="col-categoria-noticias">Categoría</th>
                                        <th class="col-autor-noticias">Autor</th>
                                        <th class="col-estado-noticias">Estado</th>
                                        <th class="col-fecha-noticias">Fecha</th>
                                        <th class="col-acciones-noticias">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="cuerpo-tabla-noticias">
                                    <tr>
                                        <td colspan="6" class="fila-vacia">Cargando noticias...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <script src="../js/admin_noticias.js"></script>
</body>
</html>
