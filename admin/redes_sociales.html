<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed de Redes Sociales — NewsCMS</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div id="contenedor-admin" class="contenedor-admin" hidden>
        <aside id="barra-lateral" class="barra-lateral" aria-label="Módulos del panel administrativo">
            <div class="marca-admin">
                <a href="index.html" class="logo-admin">News<span>CMS</span></a>
                <span id="rol-sidebar" class="rol-usuario"></span>
            </div>

            <nav class="menu-lateral">
                <p class="grupo-menu">Módulos disponibles</p>
                <ul id="lista-modulos" class="lista-modulos"></ul>
            </nav>

            <div class="pie-sidebar">
                <a href="../index.html" class="enlace-volver">&larr; Volver al portal público</a>
            </div>
        </aside>

        <div class="area-principal">
            <header class="cabecera-admin">
                <div class="cabecera-izquierda">
                    <button
                        type="button"
                        id="boton-sidebar"
                        class="boton-sidebar"
                        aria-expanded="false"
                        aria-controls="barra-lateral"
                        aria-label="Mostrar u ocultar menú lateral"
                    >
                        &#9776;
                    </button>
                    <h1 class="titulo-modulo">Configuración: Feed de Redes Sociales</h1>
                </div>

                <div class="cabecera-derecha">
                    <span id="nombre-usuario" class="perfil-previa"></span>
                    <span id="rol-usuario" class="rol-usuario"></span>
                    <button type="button" id="boton-salir" class="boton-salir">Cerrar sesión</button>
                </div>
            </header>

            <main class="contenido-admin">
                <div class="barra-herramientas">
                    <a href="complementos.html" class="enlace-secundario">&larr; Volver a Complementos</a>
                    <button type="button" id="btn-nuevo-enlace" class="boton-primario-admin">+ Agregar enlace</button>
                </div>

                <div id="mensaje-social" class="alerta-admin" role="status" hidden></div>

                <!-- Formulario HTML para crear o editar enlace social -->
                <section id="panel-formulario-social" class="tarjeta-form" hidden aria-labelledby="titulo-form-social">
                    <div class="cabecera-panel">
                        <h2 id="titulo-form-social">Agregar enlace social</h2>
                        <button type="button" id="btn-cancelar-social" class="boton-secundario-admin">Cancelar</button>
                    </div>

                    <form id="formulario-social" class="formulario-cambios" novalidate>
                        <input type="hidden" id="social-id" value="0">

                        <div class="campo-admin">
                            <label for="social-plataforma">Plataforma</label>
                            <select id="social-plataforma" required>
                                <option value="Facebook">Facebook</option>
                                <option value="Instagram">Instagram</option>
                                <option value="TikTok">TikTok</option>
                                <option value="X">X</option>
                            </select>
                        </div>

                        <div class="campo-admin">
                            <label for="social-titulo">Título o nombre</label>
                            <input type="text" id="social-titulo" maxlength="120" required>
                        </div>

                        <div class="campo-admin">
                            <label for="social-descripcion">Descripción breve</label>
                            <textarea id="social-descripcion" rows="2" maxlength="255" placeholder="Descripción breve de la publicación o perfil..."></textarea>
                        </div>

                        <div class="campo-admin">
                            <label for="social-url">URL de publicación o perfil (HTTPS)</label>
                            <input type="url" id="social-url" maxlength="500" placeholder="https://www.facebook.com/..." required>
                        </div>

                        <div class="campo-admin">
                            <label for="social-visible">Visible en el portal</label>
                            <select id="social-visible">
                                <option value="1">Sí</option>
                                <option value="0">No</option>
                            </select>
                        </div>

                        <div class="celda-acciones">
                            <button type="submit" class="boton-primario-admin">Guardar</button>
                        </div>
                    </form>
                </section>

                <section class="panel-tabla" aria-labelledby="titulo-tabla-social">
                    <div class="cabecera-panel">
                        <h2 id="titulo-tabla-social">Enlaces registrados</h2>
                        <span id="total-social" class="etiqueta-tabla">0 enlaces</span>
                    </div>

                    <div class="contenedor-tabla">
                        <table class="tabla-datos">
                            <thead>
                                <tr>
                                    <th>Plataforma</th>
                                    <th>Título</th>
                                    <th>URL</th>
                                    <th>Visible</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpo-tabla-social">
                                <tr>
                                    <td colspan="5" class="fila-vacia">Cargando enlaces...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="../js/redes_sociales_admin.js"></script>
</body>
</html>
