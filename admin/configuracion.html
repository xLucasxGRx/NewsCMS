<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración General — NewsCMS</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div id="contenedor-admin" class="contenedor-admin" hidden>
        <aside id="barra-lateral" class="barra-lateral" aria-label="Módulos del panel administrativo">
            <div class="marca-admin">
                <a href="index.html" class="logo-admin">News<span>CMS</span></a>
                <span id="rol-sidebar" class="rol-usuario"></span>
            </div>

            <nav class="menu-lateral">
                <p class="grupo-menu">Módulos disponibles</p>
                <ul id="lista-modulos" class="lista-modulos"></ul>
            </nav>

            <div class="pie-sidebar">
                <a href="../index.html" class="enlace-volver">&larr; Volver al portal público</a>
            </div>
        </aside>

        <div class="area-principal">
            <header class="cabecera-admin">
                <div class="cabecera-izquierda">
                    <button
                        type="button"
                        id="boton-sidebar"
                        class="boton-sidebar"
                        aria-expanded="false"
                        aria-controls="barra-lateral"
                        aria-label="Mostrar u ocultar menú lateral"
                    >
                        &#9776;
                    </button>
                    <h1 class="titulo-modulo">Configuración General</h1>
                </div>

                <div class="cabecera-derecha">
                    <span id="nombre-usuario" class="perfil-previa"></span>
                    <span id="rol-usuario" class="rol-usuario"></span>
                    <button type="button" id="boton-salir" class="boton-salir">Cerrar sesión</button>
                </div>
            </header>

            <main class="contenido-admin">
                <p class="texto-suave-form">
                    Administra la información básica que se muestra en el portal NewsCMS.
                </p>

                <div id="mensaje-configuracion" class="alerta-admin" role="status" hidden></div>

                <section class="tarjeta-form" aria-labelledby="titulo-form-config">
                    <h2 id="titulo-form-config">Datos generales del portal</h2>

                    <form id="formulario-configuracion" class="formulario-cambios" novalidate>
                        <div class="campo-admin">
                            <label for="nombre-portal">Nombre del portal</label>
                            <input type="text" id="nombre-portal" name="nombre_portal" maxlength="80" required>
                        </div>

                        <div class="campo-admin">
                            <label for="subtitulo-portal">Subtítulo del portal</label>
                            <input type="text" id="subtitulo-portal" name="subtitulo_portal" maxlength="150">
                        </div>

                        <div class="campo-admin">
                            <label for="descripcion-portal">Descripción del sitio</label>
                            <textarea id="descripcion-portal" name="descripcion_portal" rows="3" maxlength="300"></textarea>
                        </div>

                        <div class="campo-admin">
                            <label for="texto-pie-pagina">Texto del pie de página</label>
                            <textarea id="texto-pie-pagina" name="texto_pie_pagina" rows="2" maxlength="300"></textarea>
                        </div>

                        <div class="campo-admin">
                            <label for="correo-contacto">Correo de contacto (opcional)</label>
                            <input type="email" id="correo-contacto" name="correo_contacto" maxlength="150" placeholder="contacto@ejemplo.com">
                        </div>

                        <div class="celda-acciones">
                            <button type="submit" id="btn-guardar-config" class="boton-primario-admin">Guardar cambios</button>
                            <button type="button" id="btn-restaurar-config" class="boton-secundario-admin">
                                Restaurar valores del formulario
                            </button>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script src="../js/configuracion_admin.js"></script>
</body>
</html>
